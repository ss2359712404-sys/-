<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>旅遊危機應變模擬遊戲</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#101b2a;color:white}
#game{position:fixed;inset:0}
#hud{position:absolute;top:12px;left:12px;right:12px;background:#15253bdc;padding:13px;border-radius:12px;font-size:14px}
#controls{position:absolute;bottom:24px;left:20px;display:grid;grid-template-columns:repeat(3,48px);gap:5px}
button{border:0;border-radius:10px;padding:12px;background:#3276b9;color:white;font-size:15px;touch-action:none}
#controls button{height:48px;font-size:22px}
#action{position:absolute;bottom:42px;right:20px;background:#e6a63b;color:#111;font-weight:bold}
#panel{display:none;position:absolute;bottom:105px;left:12px;right:12px;background:#14243af5;border:1px solid #536780;border-radius:15px;padding:18px;max-height:65vh;overflow:auto}
.choice{display:block;width:100%;margin-top:9px;text-align:left;background:#304b6c}
#close{float:right;background:#4b5563;padding:6px 10px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">旅遊危機應變模擬｜第一關：機場護照遺失<br>使用方向鍵移動，靠近旅客並點擊「互動」。</div>
<div id="controls">
<span></span><button data-key="up">▲</button><span></span>
<button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button>
</div>
<button id="action">互動</button>
<div id="panel"><button id="close">✕</button><div id="content"></div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fb7cc);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x53647c,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,12,7);scene.add(light);
function cube(x,y,z,w,h,d,color){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));
m.position.set(x,y,z);scene.add(m);return m;
}
cube(0,-.15,0,24,.3,28,0xabb6c2);
cube(0,4,-13,24,8,.4,0x557b9b);
cube(-12,4,0,.3,8,28,0x718fa7);
cube(12,4,0,.3,8,28,0x718fa7);
for(let i=-1;i<=1;i++){
cube(i*5,1,-7,3,2,1.3,0x365d82);
cube(i*5,2.2,-7,3,.4,.5,0xe5b65a);
}
for(let i=0;i<4;i++){
cube(-7+i*4,.35,3,2,.7,1,0x526f88);
}
function person(x,z,color){
const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.38,.4,1.25,12),new THREE.MeshStandardMaterial({color}));
body.position.y=1;g.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),new THREE.MeshStandardMaterial({color:0xf3c6a4}));
head.position.y=1.85;g.add(head);
g.position.set(x,0,z);scene.add(g);return g;
}
const player=person(0,7,0x2563eb);
const npc=person(3,0,0xd84d4d);
const marker=new THREE.Mesh(new THREE.ConeGeometry(.25,.5,4),new THREE.MeshBasicMaterial({color:0xffd34e}));
marker.position.set(3,2.6,0);scene.add(marker);
const keys={};
document.querySelectorAll('[data-key]').forEach(b=>{
const k=b.dataset.key;
b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
b.addEventListener('pointerup',()=>keys[k]=false);
b.addEventListener('pointercancel',()=>keys[k]=false);
});
addEventListener('keydown',e=>{
const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
if(map[e.key])keys[map[e.key]]=true;
});
addEventListener('keyup',e=>{
const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
if(map[e.key])keys[map[e.key]]=false;
});
const panel=document.getElementById('panel'),content=document.getElementById('content');
document.getElementById('close').onclick=()=>panel.style.display='none';
let stage=0,score=0;
const questions=[
{q:'旅客：領隊！我的護照不見了，現在怎麼辦？',a:[
['先安撫旅客，確認護照最後使用的位置',30],
['請旅客自己尋找，不影響團體行程',0],
['直接要求旅客重新購買機票',0]]},
{q:'旅客表示最後一次看到護照是在報到櫃檯。你會怎麼做？',a:[
['協助聯繫航空公司櫃檯及機場失物招領單位',35],
['直接認定護照已經遺失，放棄尋找',0],
['讓旅客自行處理，不再協助',0]]},
{q:'目前仍找不到護照，下一步應如何處理？',a:[
['確認當地相關單位的補發及旅行文件程序，並協調行程',35],
['保證旅客一定可以搭上原班機',0],
['不通知相關單位，繼續等待',0]]}
];
function show(){
panel.style.display='block';
if(stage>=questions.length){
content.innerHTML='<h2>任務完成</h2><p>總分：'+score+'/100</p><p>本關為教學原型，評分規則仍需依專題正式標準修訂。</p><button id="restart">重新挑戰</button>';
document.getElementById('restart').onclick=()=>{stage=0;score=0;show()};
return;
}
const item=questions[stage];
content.innerHTML='<h3>事故處理 '+(stage+1)+'/3</h3><p>'+item.q+'</p>';
item.a.forEach(([label,points])=>{
const b=document.createElement('button');b.className='choice';b.textContent=label;
b.onclick=()=>{score+=points;stage++;show()};content.appendChild(b);
});
}
document.getElementById('action').onclick=()=>{
if(Math.hypot(player.position.x-npc.position.x,player.position.z-npc.position.z)<3)show();
else document.getElementById('hud').innerHTML='請先靠近紅衣旅客，再點擊互動。';
};
function animate(){
requestAnimationFrame(animate);
const speed=.085;
if(panel.style.display!=='block'){
if(keys.up)player.position.z-=speed;
if(keys.down)player.position.z+=speed;
if(keys.left)player.position.x-=speed;
if(keys.right)player.position.x+=speed;
player.position.x=THREE.MathUtils.clamp(player.position.x,-10,10);
player.position.z=THREE.MathUtils.clamp(player.position.z,-11,12);
}
camera.position.lerp(new THREE.Vector3(player.position.x,6,player.position.z+9),.08);
camera.lookAt(player.position.x,1,player.position.z-2);
marker.rotation.y+=.025;
renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
