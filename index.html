<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Travel Crisis Simulator V0.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101b2b;color:white;font-family:system-ui;overflow:hidden}
#scene{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;background:#10253ddd;padding:12px;border-radius:14px;font-size:13px;pointer-events:none}
#hud b{font-size:16px}
#pad{position:fixed;bottom:25px;left:15px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}
button{border:0;border-radius:12px;padding:12px;background:#306fa5;color:white;font-size:15px;touch-action:none}
#pad button{height:48px}
#act{position:fixed;bottom:42px;right:15px;background:#e7b45b;color:#172333;font-weight:bold}
#menu{position:fixed;top:92px;right:12px;display:flex;gap:6px}
#menu button{font-size:12px;padding:9px}
#panel{display:none;position:fixed;inset:12% 5% auto;background:#11243af7;border:1px solid #6a8ba8;border-radius:18px;padding:20px;max-height:76vh;overflow:auto;z-index:10}
#panel button{display:block;width:100%;margin-top:10px;text-align:left}
#panel .close{background:#53657b;text-align:center}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
#tip{position:fixed;bottom:180px;left:0;right:0;text-align:center;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud"></div>
<div id="cross">＋</div>
<div id="tip">左側移動｜右側滑動轉向</div>
<div id="menu"><button id="mentor">導師</button><button id="records">紀錄</button></div>
<div id="pad">
<span></span><button data-m="up">▲</button><span></span>
<button data-m="left">◀</button><button data-m="down">▼</button><button data-m="right">▶</button>
</div>
<button id="act">互動</button>
<div id="panel"></div>
<script type="module">
import * as T from 'https://esm.sh/three@0.170.0';
const levels=[
{name:'機場護照遺失',place:'airport',npc:'焦急旅客',questions:[
['旅客發現護照不見，第一步應如何處理？',['安撫旅客並確認最後使用位置','要求旅客自行尋找','立即放棄行程'],0],
['仍未找到護照，接下來應該？',['先不處理','聯繫機場及航空公司相關窗口','保證一定能登機'],1],
['確認護照遺失後應如何處理？',['查明當地旅行文件補發程序並協調行程','直接購買新機票','不通知相關單位'],0]]},
{name:'飯店旅客身體不適',place:'hotel',npc:'身體不適旅客',questions:[
['旅客表示胸痛、呼吸困難，應如何處理？',['請旅客休息到早上','立即聯絡當地緊急醫療服務並確認安全','自行提供不明藥物'],1],
['等待救援時應如何協調？',['協助提供位置、症狀與必要資訊','讓旅客獨自等待','不告知飯店'],0],
['後續團體行程應如何安排？',['直接取消全部行程','不做紀錄','依現場情況協調同行者、旅行社及後續安排'],2]]},
{name:'遊覽車交通事故',place:'road',npc:'受傷旅客',questions:[
['遊覽車發生事故，首要任務是？',['先拍攝影片','確認現場安全、傷者狀況並尋求緊急救援','立刻繼續行程'],1],
['處理現場時應如何分工？',['讓所有旅客自行離開','忽略其他旅客','協調安全位置、清點人數並通報相關單位'],2],
['事故後續應如何處理？',['紀錄必要資訊並協調醫療、交通及行程','刪除事故紀錄','直接保證所有賠償'],0]]}
];
let level=0,step=0,score=0,phase='pre',logs=[];
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x53647a,2.1));
const sun=new T.DirectionalLight(0xffffff,2.2);
sun.position.set(5,10,3);scene.add(sun);
let objects=[],npc;
let pos=new T.Vector3(0,1.7,7),yaw=0,pitch=0;
const keys={};
function block(x,y,z,w,h,d,c){
let m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,roughness:.8}));
m.position.set(x,y,z);scene.add(m);objects.push(m);return m;
}
function clear(){objects.forEach(o=>scene.remove(o));objects=[]}
function human(x,z,c){
let g=new T.Group();
let body=new T.Mesh(new T.CylinderGeometry(.34,.42,1.2,12),new T.MeshStandardMaterial({color:c}));
body.position.y=1;g.add(body);
let head=new T.Mesh(new T.SphereGeometry(.28,16,12),new T.MeshStandardMaterial({color:0xe7b69a}));
head.position.y=1.85;g.add(head);
g.position.set(x,0,z);scene.add(g);objects.push(g);return g;
}
function build(){
clear();scene.background=new T.Color(level===2?0x9dc4e1:0x9ab4cb);
block(0,-.2,0,25,.4,30,level===2?0x777e80:0xaeb9c4);
if(level===0){
block(0,4,-12,25,8,.4,0x4d7494);
for(let i=-1;i<=1;i++){
block(i*5,1,-6,3,2,1.2,0x356187);
block(i*5,2.3,-6,3,.5,.5,0xe3bc6c);
block(i*5,5,-11.7,3,1,.1,0x2c4b66);
}
for(let i=0;i<5;i++)block(-8+i*4,.5,3,2,1,1,0x4d6e85);
}else if(level===1){
block(0,4,-12,25,8,.4,0x8e796b);
block(0,1,-7,8,2,1.5,0x644a3d);
for(let i=0;i<4;i++){
block(-8+i*5,.45,2,2,.9,1.4,0x79614c);
block(-8+i*5,2.8,-11.7,2,2,.15,0xd9c29b);
}
}else{
block(0,.02,0,8,.04,30,0x424d56);
for(let i=0;i<7;i++)block(0,.05,-12+i*4,.2,.03,1.6,0xf5e5a3);
block(-6,1,-5,3,2,6,0x356d9b);
block(-6,2.2,-5,2,.8,3,0xb0d5e6);
for(let i=0;i<6;i++)block(8,1,-12+i*5,1,2,1,0x5c8b52);
}
npc=human(2,0,0xc75050);
human(-4,-2,0x5c78a9);
human(5,-5,0x4e967a);
pos.set(0,1.7,7);yaw=0;pitch=0;
updateHud();
}
function updateHud(){
document.getElementById('hud').innerHTML='<b>Travel Crisis Simulator V0.2</b><br>第'+(level+1)+'關：'+levels[level].name+'｜得分 '+score+'<br>尋找「'+levels[level].npc+'」並點擊互動';
}
const panel=document.getElementById('panel');
function show(html){panel.style.display='block';panel.innerHTML=html}
function close(){panel.style.display='none'}
function button(label,fn){
let b=document.createElement('button');b.textContent=label;b.onclick=fn;panel.appendChild(b);
}
function start(){
phase='pre';step=0;score=0;logs=[];
show('<h2>第'+(level+1)+'關：'+levels[level].name+'</h2><p>你是旅行團領隊。請先回答前測，再進入場景執行任務。</p>');
button('開始前測',()=>question());
}
function question(){
let q=levels[level].questions[step];
if(!q){finishPhase();return}
show('<h3>'+(phase==='pre'?'前測':'事故處理')+' '+(step+1)+'/3</h3><p>'+q[0]+'</p>');
q[1].forEach((answer,i)=>button(answer,()=>{
let correct=i===q[2];
if(phase==='play'&&correct)score+=Math.round(100/3);
logs.push({level:level+1,phase,question:step+1,answer,correct,time:new Date().toISOString()});
step++;
question();
}));
}
function finishPhase(){
if(phase==='pre'){
phase='play';step=0;
show('<h3>前測完成</h3><p>現在進入第一人稱場景，尋找事故當事人。</p>');
button('進入場景',close);
}else{
show('<h2>本關完成</h2><p>事故處理得分：'+Math.min(score,100)+'/100</p><p>此為原型分數，不是正式研究量表。</p>');
button('下一關',()=>{
level=(level+1)%levels.length;build();start();
});
button('查看紀錄',records);
}
}
function interact(){
if(panel.style.display==='block')return;
let distance=Math.hypot(pos.x-npc.position.x,pos.z-npc.position.z);
if(distance>3){document.getElementById('tip').textContent='請靠近事故當事人（紅衣人物）';return}
phase='play';step=0;question();
}
document.getElementById('act').onclick=interact;
document.getElementById('mentor').onclick=()=>{
show('<h3>GAI 導師介面（示範版）</h3><p>先確認人員安全，再釐清事實、聯繫相關單位，最後協調後續處理。</p><p>目前為固定規則提示，尚未連接生成式 AI。</p>');
button('返回遊戲',close);
};
function records(){
show('<h3>學習紀錄</h3><p>已記錄 '+logs.length+' 次作答。</p>');
button('匯出 JSON',()=>{
let blob=new Blob([JSON.stringify(logs,null,2)],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='travel-crisis-records.json';a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
button('返回遊戲',close);
}
document.getElementById('records').onclick=records;
document.querySelectorAll('[data-m]').forEach(b=>{
let k=b.dataset.m;
b.addEventListener('pointerdown',e=>{keys[k]=true;b.setPointerCapture(e.pointerId)});
b.addEventListener('pointerup',()=>keys[k]=false);
b.addEventListener('pointercancel',()=>keys[k]=false);
});
let lastX=0,lastY=0,looking=false;
renderer.domElement.addEventListener('pointerdown',e=>{looking=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{
if(!looking)return;
yaw-=(e.clientX-lastX)*.005;
pitch=Math.max(-.9,Math.min(.9,pitch-(e.clientY-lastY)*.004));
lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>looking=false);
function frame(){
requestAnimationFrame(frame);
if(panel.style.display!=='block'){
let dx=0,dz=0;
if(keys.up)dz-=1;if(keys.down)dz+=1;
if(keys.left)dx-=1;if(keys.right)dx+=1;
let len=Math.hypot(dx,dz)||1;
pos.x+=(dx*Math.cos(yaw)+dz*Math.sin(yaw))*.09/len;
pos.z+=(-dx*Math.sin(yaw)+dz*Math.cos(yaw))*.09/len;
pos.x=T.MathUtils.clamp(pos.x,-10,10);
pos.z=T.MathUtils.clamp(pos.z,-10,12);
}
camera.position.copy(pos);
camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
build();start();frame();
</script>
</body>
</html>
